default_language_version:
  python: python3.13
# Install the commit-msg hook too, so that commitlint checks each commit message.
# semantic-release versions the app from the conventional commit messages.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/DanielNoord/pydocstringformatter
    rev: v1.0.0
    hooks:
      - id: pydocstringformatter
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        args: [--py313-plus]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words=codespell.txt"]
        exclude: '(\.svg$|data/wfu-1-metaai\.yaml|^requirements/)'
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        args: [--no-error-on-unmatched-pattern]
        types_or: [markdown, yaml, json]
        # semantic-release writes the changelog in its own style on every
        # release, so reformatting it would only be undone by the next one.
        exclude: ^CHANGELOG\.md$
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
  - repo: https://github.com/PyCQA/isort
    rev: 10.0.0b1
    hooks:
      - id: isort
        args: ["--settings-path=pyproject.toml"]
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.4.0
    hooks:
      - id: autoflake
        args: [--in-place, --remove-all-unused-imports]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-ll"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: trailing-whitespace
      - id: debug-statements
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        # The latest Node.js release can be a prerelease (v27.0.0-alpha), whose version nodeenv
        # cannot parse, so the hook's environment failed to install. The latest LTS is a release.
        language_version: lts
        additional_dependencies:
          ["@commitlint/config-conventional", "@commitlint/config-angular"]
