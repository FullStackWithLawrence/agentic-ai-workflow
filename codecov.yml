# Codecov: the coverage that .github/workflows/ci.yml uploads from its test job.
# Reported, not enforced, so that a pull request isn't blocked by a percentage.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, files"
  require_changes: true
