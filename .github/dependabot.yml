version: 2
updates:
  - package-ecosystem: "pip"
    directory: "requirements/in/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "python"
      - "automated pr"
    target-branch: "alpha"
  - package-ecosystem: "npm"
    directory: "/"
    labels:
      - "dependencies"
      - "javascript"
      - "automated pr"
    schedule:
      interval: "monthly"
    target-branch: "alpha"
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
      - "automated pr"
    schedule:
      interval: "monthly"
    target-branch: "alpha"
