# Monthly pull requests, against alpha, for the pinned Python requirements and the workflows' actions.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/requirements/in/"
    schedule:
      interval: "monthly"
    target-branch: "alpha"
    labels:
      - "dependencies"
      - "python"
      - "automated pr"
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
      - "automated pr"
    schedule:
      interval: "monthly"
    target-branch: "alpha"
